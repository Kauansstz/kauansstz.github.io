        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }


        /* =========================================================
           GLOBAL
        ========================================================= */

        :root {

            --background: #050505;
            --terminal: #090909;
            --header: #151515;

            --green: #00ff66;
            --green-dark: #00a844;

            --cyan: #00e5ff;
            --yellow: #ffd75f;

            --red: #ff5555;

            --white: #f5f5f5;
            --gray: #888;
            --dark-gray: #333;

            --border: #252525;

            --font:
                "JetBrains Mono",
                "Fira Code",
                "Cascadia Code",
                "Courier New",
                monospace;
        }


        body {

            background:
                radial-gradient(
                    circle at center,
                    #101010 0%,
                    #050505 55%,
                    #000 100%
                );

            color: var(--green);

            font-family: var(--font);

            overflow: hidden;
        }


        /* =========================================================
           TERMINAL
        ========================================================= */

        .terminal {

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            background: var(--terminal);
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .terminal-header {

            height: 48px;
            min-height: 48px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            background:
                linear-gradient(
                    to bottom,
                    #1b1b1b,
                    #111
                );

            border-bottom:
                1px solid var(--border);

            user-select: none;
        }


        .buttons {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .button {

            width: 12px;
            height: 12px;

            border-radius: 50%;

            box-shadow:
                inset 0 0 0 1px rgba(
                    255,
                    255,
                    255,
                    0.12
                );
        }


        .red {
            background: #ff5f56;
        }


        .yellow {
            background: #ffbd2e;
        }


        .green {
            background: #27c93f;
        }


        .terminal-title {

            flex: 1;

            margin-left: 18px;

            color: #aaa;

            font-size: 13px;

            text-align: center;

            margin-right: 65px;
        }


        .terminal-status {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #777;

            font-size: 11px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 8px var(--green);
        }


        /* =========================================================
           TERMINAL BODY
        ========================================================= */

        .terminal-body {

            flex: 1;

            overflow-y: auto;

            padding: 28px;

            cursor: text;

            scroll-behavior: smooth;

            scrollbar-width: thin;

            scrollbar-color:
                #333
                transparent;
        }


        .terminal-body::-webkit-scrollbar {

            width: 7px;
        }


        .terminal-body::-webkit-scrollbar-track {

            background: transparent;
        }


        .terminal-body::-webkit-scrollbar-thumb {

            background: #333;

            border-radius: 10px;
        }


        /* =========================================================
           OUTPUT
        ========================================================= */

        .line {

            white-space: pre-wrap;

            word-break: break-word;

            line-height: 1.65;

            font-size: 14px;

            margin: 1px 0;
        }


        .command-output {

            margin-bottom: 4px;
        }


        .prompt {

            color: var(--green);

            font-weight: 600;

            white-space: nowrap;
        }


        .white {
            color: var(--white);
        }


        .cyan {
            color: var(--cyan);
        }


        .yellow-text {
            color: var(--yellow);
        }


        .gray {
            color: var(--gray);
        }


        .red-text {
            color: var(--red);
        }


        .green-text {
            color: var(--green);
        }


        .muted {
            color: #666;
        }


        .link {

            color: var(--cyan);

            text-decoration: none;

            cursor: pointer;
        }


        .link:hover {

            text-decoration: underline;
        }


        /* =========================================================
           INPUT
        ========================================================= */

        .command-line {

            display: flex;

            align-items: center;

            width: 100%;

            margin-top: 8px;

            min-height: 25px;
        }


        #command {

            flex: 1;

            min-width: 0;

            padding: 0;

            margin: 0;

            background: transparent;

            border: none;

            outline: none;

            color: var(--white);

            caret-color: var(--green);

            font-family: var(--font);

            font-size: 14px;
        }


        #command::selection {

            background: rgba(
                0,
                255,
                102,
                0.25
            );
        }


        /* =========================================================
           BOOT SCREEN
        ========================================================= */

        .boot-line {

            color: #777;
        }


        .boot-ok {

            color: var(--green);
        }


        .boot-warning {

            color: var(--yellow);
        }


        /* =========================================================
           CARDS / TABLES
        ========================================================= */

        .repo {

            margin: 8px 0 14px 0;

            padding: 12px 15px;

            border-left:
                2px solid
                var(--green);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.015
                );
        }


        .repo-title {

            color: var(--cyan);

            font-weight: bold;
        }


        .repo-meta {

            color: #888;

            margin-top: 4px;
        }


        .repo-description {

            color: #ccc;

            margin-top: 6px;
        }


        .repo-links {

            margin-top: 7px;
        }


        /* =========================================================
           ASCII
        ========================================================= */

        .ascii {

            color: var(--green);

            line-height: 1.25;

            font-size: 12px;

            white-space: pre;

            overflow-x: auto;
        }


        /* =========================================================
           CURSOR
        ========================================================= */

        .cursor {

            display: inline-block;

            width: 8px;
            height: 16px;

            margin-left: 2px;

            background: var(--green);

            vertical-align: middle;

            animation:
                blink 1s steps(1) infinite;
        }


        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .terminal-header {

                height: 42px;

                min-height: 42px;

                padding: 0 12px;
            }


            .terminal-title {

                font-size: 11px;

                margin-left: 12px;

                margin-right: 0;
            }


            .terminal-status {

                display: none;
            }


            .terminal-body {

                padding: 17px 14px;
            }


            .line,
            #command {

                font-size: 12px;
            }


            .ascii {

                font-size: 7px;
            }

        }

    </style>

</head>

    function escapeHTML(value) {

        return String(value ?? "")

            .replaceAll("&", "&amp;")

            .replaceAll("<", "&lt;")

            .replaceAll(">", "&gt;")

            .replaceAll('"', "&quot;")

            .replaceAll("'", "&#039;");
    }


    /* =========================================================
       OUTPUT
    ========================================================= */


    function print(
        content = "",
        className = ""
    ) {

        const element =
            document.createElement("div");


        element.className =
            `line ${className}`;


        element.innerHTML =
            content;


        output.appendChild(element);


        scrollToBottom();

    }


    function blank() {

        print("");

    }


    function scrollToBottom() {

        terminal.scrollTop =
            terminal.scrollHeight;

    function sleep(ms) {

            resolve => setTimeout(
                resolve,
                ms

    /* =========================================================
       GITHUB API
    ========================================================= */


    async function loadRepositories() {

        if (isLoadingRepositories) {

            return;

        }


        isLoadingRepositories = true;


        try {

            const response =
                await fetch(
                    `${API_URL}?per_page=100&sort=updated`
                );


            if (!response.ok) {

                throw new Error(
                    `GitHub API returned ${response.status}`
                );

            }


            repositories =
                await response.json();


            repositories =
                repositories.filter(
                    repo => !repo.fork
                );


        } catch (error) {

            console.error(error);

            repositories = [];

        } finally {

            isLoadingRepositories = false;

        }

    }


    /* =========================================================
       README API
    ========================================================= */


    async function getReadme(repository) {

        try {

            const response =
                await fetch(
                    `https://api.github.com/repos/${USERNAME}/${repository.name}/readme`
                );


            if (!response.ok) {

                return null;

            }


            return await response.json();


        } catch (error) {

            console.error(error);

            return null;

        }

    }


    /* =========================================================
       CI / ACTIONS
    ========================================================= */


    async function getLatestWorkflow(repository) {

        try {

            const response =
                await fetch(
                    `https://api.github.com/repos/${USERNAME}/${repository.name}/actions/runs?per_page=1`
                );


            if (!response.ok) {

                return null;

            }


            const data =
                await response.json();


            if (
                !data.workflow_runs ||
                data.workflow_runs.length === 0
            ) {

                return null;

            }


            return data.workflow_runs[0];

        } catch {

            return null;

        }

    }

</span>`
            );

    }


    /* =========================================================
       BASE64 DECODER
    ========================================================= */


    function decodeBase64(value) {

        const clean =
            value.replace(
                /\s/g,
                ""
            );


        const binary =
            atob(clean);


        const bytes =
            Uint8Array.from(
                binary,
                char => char.charCodeAt(0)
            );


        return new TextDecoder(
            "utf-8"
        ).decode(bytes);

    }

    /* =========================================================
       COMMAND EXECUTION
    ========================================================= */


    async function executeCommand(rawCommand) {

        const command =
            rawCommand.trim();


        if (!command) {

            return;

        }


        printCommand(command);


        const parts =
            command.split(/\s+/);


        const baseCommand =
            parts[0].toLowerCase();


        const argument =
            parts[1];


        switch (baseCommand) {


            case "help":

                commandHelp();

                break;


            case "about":

                commandAbout();

                break;


            case "whoami":

                commandWhoami();

                break;


            case "skills":

                commandSkills();

                break;


            case "projects":

                await commandProjects();

                break;


            case "repositories":

            case "repository":

            case "repos":

                await commandRepositories();

                break;


            case "repo":

                await commandRepo(
                    argument
                );

                break;


            case "readme":

            case "cat":

                await commandReadme(
                    argument
                );

                break;


            case "neofetch":

                commandNeofetch();

                break;


            case "github":

                commandGithub();

                break;


            case "contact":

                commandContact();

                break;


            case "clear":

            case "cls":

                commandClear();

                break;


            default:

                print(
`<span class="red-text">
Command not found: ${escapeHTML(baseCommand)}

Type "help" to see available commands.
</span>`
                );

        }


        scrollToBottom();

    }


    /* =========================================================
       KEYBOARD
    ========================================================= */


    input.addEventListener(
        "keydown",
        async function(event) {


            /* ENTER */

            if (
                event.key === "Enter"
            ) {

                const command =
                    input.value.trim();


                if (!command) {

                    return;

                }


                commandHistory.push(
                    command
                );


                historyIndex =
                    commandHistory.length;


                input.value = "";


                await executeCommand(
                    command
                );


                focusInput();

            }


            /* ARROW UP */

            else if (
                event.key === "ArrowUp"
            ) {

                event.preventDefault();


                if (
                    commandHistory.length === 0
                ) {

                    return;

                }


                historyIndex =
                    Math.max(
                        0,
                        historyIndex - 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ];

            }


            /* ARROW DOWN */

            else if (
                event.key === "ArrowDown"
            ) {

                event.preventDefault();


                if (
                    commandHistory.length === 0
                ) {

                    return;

                }


                historyIndex =
                    Math.min(
                        commandHistory.length,
                        historyIndex + 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ] || "";

            }


            /* TAB AUTOCOMPLETE */

            else if (
                event.key === "Tab"
            ) {

                event.preventDefault();


                const current =
                    input.value
                        .trim()
                        .toLowerCase();


                if (!current) {

                    return;

                }


                const matches =
                    COMMANDS.filter(
                        command =>
                            command.startsWith(
                                current
                            )
                    );


                if (
                    matches.length === 1
                ) {

                    input.value =
                        matches[0] + " ";

                }

            }


        }
    );
