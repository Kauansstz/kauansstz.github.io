    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;
        }


        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {

            --background: #050505;

            --terminal: #090909;

            --header: #151515;

            --green: #00ff66;

            --green-dark: #00a844;

            --cyan: #00e5ff;

            --yellow: #ffd75f;

            --red: #ff5555;

            --white: #f5f5f5;

            --gray: #888;

            --dark-gray: #333;

            --border: #252525;

            --font:
                "JetBrains Mono",
                "Fira Code",
                "Cascadia Code",
                "Courier New",
                monospace;
        }


        /* =========================================================
           BODY
        ========================================================= */

        body {

            background:

                radial-gradient(
                    circle at center,
                    #101010 0%,
                    #050505 55%,
                    #000 100%
                );

            color: var(--green);

            font-family: var(--font);

            overflow: hidden;
        }


        /* =========================================================
           TERMINAL
        ========================================================= */

        .terminal {

            width: 100%;

            height: 100vh;

            display: flex;

            flex-direction: column;

            background: var(--terminal);
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .terminal-header {

            height: 48px;

            min-height: 48px;

            display: flex;

            align-items: center;

            padding: 0 16px;

            background:

                linear-gradient(
                    to bottom,
                    #1b1b1b,
                    #111
                );

            border-bottom:
                1px solid var(--border);

            user-select: none;
        }


        .buttons {

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .button {

            width: 12px;

            height: 12px;

            border-radius: 50%;

            box-shadow:

                inset
                0 0 0 1px
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );
        }


        .red {

            background: #ff5f56;
        }


        .yellow {

            background: #ffbd2e;
        }


        .green {

            background: #27c93f;
        }


        .terminal-title {

            flex: 1;

            margin-left: 18px;

            margin-right: 65px;

            color: #aaa;

            font-size: 13px;

            text-align: center;
        }


        .terminal-status {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #777;

            font-size: 11px;
        }


        .status-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 8px var(--green);
        }


        /* =========================================================
           TERMINAL BODY
        ========================================================= */

        .terminal-body {

            flex: 1;

            overflow-y: auto;

            padding: 28px;

            cursor: text;

            scroll-behavior: smooth;

            scrollbar-width: thin;

            scrollbar-color:
                #333
                transparent;
        }


        .terminal-body::-webkit-scrollbar {

            width: 7px;
        }


        .terminal-body::-webkit-scrollbar-track {

            background: transparent;
        }


        .terminal-body::-webkit-scrollbar-thumb {

            background: #333;

            border-radius: 10px;
        }


        /* =========================================================
           OUTPUT
        ========================================================= */

        .line {

            white-space: pre-wrap;

            word-break: break-word;

            line-height: 1.65;

            font-size: 14px;

            margin: 1px 0;
        }


        .prompt {

            color: var(--green);

            font-weight: 600;

            white-space: nowrap;
        }


        .white {

            color: var(--white);
        }


        .cyan {

            color: var(--cyan);
        }


        .yellow-text {

            color: var(--yellow);
        }


        .gray {

            color: var(--gray);
        }


        .red-text {

            color: var(--red);
        }


        .green-text {

            color: var(--green);
        }


        .muted {

            color: #666;
        }


        .link {

            color: var(--cyan);

            text-decoration: none;

            cursor: pointer;
        }


        .link:hover {

            text-decoration: underline;
        }


        /* =========================================================
           REPOSITORY
        ========================================================= */

        .repo {

            margin:

                10px
                0
                16px
                0;

            padding:

                12px
                15px;

            border-left:

                2px solid
                var(--green);

            background:

                rgba(
                    255,
                    255,
                    255,
                    0.015
                );
        }


        .repo-title {

            color: var(--cyan);

            font-weight: bold;
        }


        .repo-meta {

            color: #888;

            margin-top: 4px;
        }


        .repo-description {

            color: #ccc;

            margin-top: 6px;
        }


        /* =========================================================
           ASCII
        ========================================================= */

        .ascii {

            color: var(--green);

            line-height: 1.25;

            font-size: 12px;

            white-space: pre;

            overflow-x: auto;
        }


        /* =========================================================
           CURSOR
        ========================================================= */

        .cursor {

            display: inline-block;

            width: 8px;

            height: 16px;

            margin-left: 2px;

            background: var(--green);

            vertical-align: middle;

            animation:

                blink
                1s
                steps(1)
                infinite;
        }


        @keyframes blink {

            0%,
            50% {

                opacity: 1;
            }

            51%,
            100% {

                opacity: 0;
            }
        }


        /* =========================================================
           INPUT
        ========================================================= */

        .command-line {

            display: flex;

            align-items: center;

            width: 100%;

            margin-top: 8px;

            min-height: 25px;
        }


        #command {

            flex: 1;

            min-width: 0;

            padding: 0;

            margin: 0;

            border: none;

            outline: none;

            caret-color: var(--green);

        }

                    255,
                    102,
                    0.25

           MOBILE
        ========================================================= */

            }


            .terminal-body {

                    14px;
            }


            .line,
            #command {

                font-size: 12px;
            }


            .ascii {

                font-size: 7px;
            }

        }

    </style>

<script>

    /* =========================================================
       CONFIGURATION
    ========================================================= */


    const USERNAME = "kauansstz";


    const GITHUB_URL =
        `https://github.com/${USERNAME}`;


    /*
     * IMPORTANTE:
     *
     * O terminal NÃO consulta mais
     * a API do GitHub diretamente.
     *
     * Os dados serão carregados
     * através deste arquivo local.
     */

    const REPOSITORIES_URL =
        "./data/repositories.json";


    /* =========================================================
       ELEMENTS
    ========================================================= */


    const terminal =
        document.getElementById(
            "terminal"
        );


    const output =
        document.getElementById(
            "output"
        );


    const input =
        document.getElementById(
            "command"
        );


    /* =========================================================
       STATE
    ========================================================= */


    let repositories = [];


    let repositoriesLoaded = false;


    let commandHistory = [];


    let historyIndex = -1;


    /* =========================================================
       UTILS
    ========================================================= */


    function escapeHTML(value) {

        return String(value ?? "")

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    function print(
        content = ""
    ) {


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "line";


        element.innerHTML =
            content;


        output.appendChild(
            element
        );


        terminal.scrollTop =
            terminal.scrollHeight;

    }


    function sleep(ms) {

        return new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    ms
                )
        );

    }


    function focusInput() {

        input.focus();

    }


    function formatDate(date) {

        if (!date) {

            return "Unknown";

        }


        return new Date(date)
            .toLocaleDateString(
                "pt-BR"
            );

    }


    /* =========================================================
       LOAD LOCAL REPOSITORIES
    ========================================================= */


    async function loadRepositories() {


        if (
            repositoriesLoaded
        ) {

            return true;

        }


        try {


            const response =
                await fetch(
                    REPOSITORIES_URL,
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            if (
                !Array.isArray(data)
            ) {

                throw new Error(
                    "repositories.json must contain an array."
                );

            }


            repositories =
                data;


            repositoriesLoaded =
                true;


            return true;


        } catch (error) {


            console.error(
                "Repository data error:",
                error
            );


            print(
`<span class="red-text">

[DATA ERROR]

Unable to load:

${escapeHTML(
    REPOSITORIES_URL
)}

Error:

${escapeHTML(
    error.message
)}

</span>`
            );


            return false;

        }

    }

    /* =========================================================
       REPOSITORY INSPECTOR
    ========================================================= */


    async function commandRepo(
        number
    ) {


        if (!number) {


            print(
`<span class="yellow-text">

Usage:

repo &lt;number&gt;

Example:

repo 1

</span>`
            );


            return;

        }


        const loaded =
            await loadRepositories();


        if (!loaded) {

            return;

        }


        const index =
            Number(number) - 1;


        if (
            !Number.isInteger(index) ||
            index < 0 ||
            index >= repositories.length
        ) {


            print(
`<span class="red-text">

Repository not found: ${escapeHTML(
    number
)}

Use:

repositories

to see the available repositories.

</span>`
            );


            return;

        }


        const repo =
            repositories[index];


        print(
`<span class="cyan">

REPOSITORY INSPECTOR

══════════════════════════════════════════════════════════════

</span>`
        );


        print(
`<span class="white">

Repository : ${escapeHTML(repo.name)}

Language   : ${escapeHTML(
    repo.language ||
    "Unknown"
)}

Stars      : ★ ${repo.stars ?? 0}

Forks      : ${repo.forks ?? 0}

Branch     : ${escapeHTML(
    repo.default_branch ||
    "main"
)}

Created    : ${formatDate(
    repo.created_at
)}

Updated    : ${formatDate(
    repo.updated_at
)}

README     : ${
    repo.readme
        ? "✓ FOUND"
        : "✗ NOT FOUND"
}

</span>`
        );


        print(
`<span class="gray">

Description:

${escapeHTML(
    repo.description ||
    "No description available."
)}

</span>`
        );


        print(
`<span class="cyan">

GitHub:

${escapeHTML(
    repo.url ||
    `https://github.com/${USERNAME}/${repo.name}`
)}

</span>`
        );


        print(
`<span class="gray">

Commands:

readme ${number}

</span>`
        );

    }

            index < 0 ||

            repositories[index];

        print(

    repo.name
)}

</span>`

        window.open(

    /* =========================================================
       COMMAND PROCESSOR
    ========================================================= */


    async function executeCommand(
        rawCommand
    ) {


        const command =
            rawCommand.trim();


        if (!command) {

            return;

        }


        print(
`<span class="prompt">

kauansstz@portfolio:~$

</span> ${escapeHTML(command)}`
        );


        const parts =
            command.split(
                /\s+/
            );


        const base =
            parts[0]
                .toLowerCase();


        const argument =
            parts[1];


        switch (
            base
        ) {


            case "help":

                commandHelp();

                break;


            case "about":

                commandAbout();

                break;


            case "whoami":

                commandWhoami();

                break;


            case "skills":

            case "tech":

                commandSkills();

                break;


            case "projects":

                await commandProjects();

                break;


            case "repositories":

            case "repository":

            case "repos":

                await commandRepositories();

                break;


            case "repo":

                await commandRepo(
                    argument
                );

                break;


            case "readme":

                await commandReadme(
                    argument
                );

                break;


            case "neofetch":

                commandNeofetch();

                break;


            case "github":

                commandGithub();

                break;


            case "contact":

                commandContact();

                break;


            case "sudo":

                if (
                    argument === "hire"
                ) {

                    await commandHire(
                        parts[2]
                    );

                } else {

                    print(
`<span class="red-text">

sudo: command not available.

Try:

sudo hire kauan

</span>`
                    );

                }

                break;


            case "clear":

            case "cls":

                commandClear();

                break;


            default:

                print(
`<span class="red-text">

Command not found:

${escapeHTML(base)}

Type "help" for available commands.

</span>`
                );

        }

    }


    /* =========================================================
       KEYBOARD
    ========================================================= */


    input.addEventListener(
        "keydown",
        async function(event) {


            /* ENTER */

            if (
                event.key === "Enter"
            ) {


                const command =
                    input.value.trim();


                if (!command) {

                    return;

                }


                commandHistory.push(
                    command
                );


                historyIndex =
                    commandHistory.length;


                input.value = "";


                await executeCommand(
                    command
                );


                focusInput();

            }


            /* ARROW UP */

            else if (
                event.key === "ArrowUp"
            ) {


                event.preventDefault();


                if (
                    commandHistory.length === 0
                ) {

                    return;

                }


                historyIndex =
                    Math.max(
                        0,
                        historyIndex - 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ];

            }


            /* ARROW DOWN */

            else if (
                event.key === "ArrowDown"
            ) {


                event.preventDefault();


                if (
                    commandHistory.length === 0
                ) {

                    return;

                }


                historyIndex =
                    Math.min(
                        commandHistory.length,
                        historyIndex + 1
                    );


                input.value =
                    commandHistory[
                        historyIndex
                    ] || "";

            }


            /* TAB */

            else if (
                event.key === "Tab"
            ) {


                event.preventDefault();


                const value =
                    input.value
                        .toLowerCase();


                const commands = [

                    "help",

                    "about",

                    "whoami",

                    "skills",

                    "projects",

                    "repositories",

                    "repo",

                    "readme",

                    "neofetch",

                    "github",

                    "contact",

                    "clear",

                    "sudo"

                ];


                const match =
                    commands.find(
                        command =>
                            command.startsWith(
                                value
                            )
                    );


                if (match) {

                    input.value =
                        match;

                }

            }

        }
    );


    /* =========================================================
       BOOT
    ========================================================= */


    async function boot() {


        print(
`<span class="cyan">

Initializing Kauan's Terminal...

</span>`
        );


        await sleep(
            300
        );


        print(
`<span class="gray">

[BOOT] Loading portfolio environment...

</span>`
        );


        await sleep(
            250
        );


        print(
`<span class="green-text">

[ OK ] Terminal initialized

</span>`
        );


        await sleep(
            200
        );


        print(
`<span class="green-text">

[ OK ] User: ${USERNAME}

</span>`
        );


        await sleep(
            200
        );


        print(
`<span class="gray">

[DATA] Loading repository index...

</span>`
        );


        const loaded =
            await loadRepositories();


        await sleep(
            200
        );


        if (loaded) {


            print(
`<span class="green-text">

[ OK ] Repository index loaded
[ OK ] ${repositories.length} repositories available

</span>`
            );


        } else {


            print(
`<span class="yellow-text">

[WARN] Repository index unavailable

</span>`
            );

        }


        await sleep(
            200
        );


        print(
`<span class="green-text">

[ OK ] Interactive shell ready

</span>`
        );


        print("");


        print(
`<span class="white">

Welcome to Kauan's Terminal.

</span>`
        );


        print(
`Type <span class="cyan">help</span>
to see available commands.`
        );


        print("");


        focusInput();

    }


    /* =========================================================
       START
    ========================================================= */


    boot();

</script>
